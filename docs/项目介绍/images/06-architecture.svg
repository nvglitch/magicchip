<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#106fb8" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Inter,'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#526377}
      .column{font-size:24px;font-weight:700}.heading{font-size:22px;font-weight:700}
      .body{font-size:18px;fill:#526377}.small{font-size:16px;fill:#64748b}.tag{font-size:15px;fill:#106fb8;font-weight:700}
      .surface{fill:#fff;stroke:#d9e4eb;stroke-width:1.5}.node{fill:#f6f9fc;stroke:#dceefa;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="1010" fill="#f3f7f5"/>
  <rect x="40" y="40" width="6" height="52" rx="3" fill="#106fb8"/>
  <text x="64" y="65" class="title">MagicChip · 网站系统架构</text>
  <text x="64" y="96" class="subtitle">用产品事实连接公开内容、选型交互与持续维护</text>
  <rect x="40" y="130" width="1360" height="78" rx="16" fill="#172033"/>
  <g font-size="22" font-weight="600" text-anchor="middle">
    <text x="216" y="178" fill="#fff" style="fill:#fff">发现产品</text>
    <text x="553" y="178" fill="#fff" style="fill:#fff">比较配置</text>
    <text x="890" y="178" fill="#fff" style="fill:#fff">核对参数与资料</text>
    <text x="1222" y="178" fill="#fff" style="fill:#fff">联系销售</text>
  </g>
  <g stroke="#87c1e8" stroke-width="2"><path d="M360 170h50m-8-7 8 7-8 7"/><path d="M697 170h50m-8-7 8 7-8 7"/><path d="M1034 170h50m-8-7 8 7-8 7"/></g>

  <rect x="40" y="238" width="424" height="574" rx="18" class="surface"/>
  <text x="66" y="277" class="tag">01 / CONTENT &amp; DOMAIN</text>
  <text x="66" y="315" class="column">内容与领域数据</text>
  <rect x="64" y="340" width="376" height="124" rx="12" class="node"/>
  <text x="86" y="374" class="heading">产品目录 · 系列 · SKU</text>
  <text x="86" y="406" class="body">四类 catalog + 特定型号内容</text>
  <text x="86" y="435" class="body">参数、兼容机箱、图片、别名</text>
  <rect x="64" y="480" width="376" height="124" rx="12" class="node"/>
  <text x="86" y="514" class="heading">JSON · 词典 · 公开资源</text>
  <text x="86" y="546" class="body">轮播、新闻、站点配置、五语言</text>
  <text x="86" y="575" class="body">public/assets 图片与 PDF</text>
  <rect x="64" y="620" width="376" height="154" rx="12" fill="#fff7e8" stroke="#f0d8aa"/>
  <text x="86" y="654" class="heading">离线维护与事实核对</text>
  <text x="86" y="686" class="body">来源指纹 → 人工审核 → 导入</text>
  <text x="86" y="715" class="body">observed 与 applied 分开记录</text>
  <text x="86" y="744" class="small">不是自动发布服务；外部资料只读</text>

  <rect x="508" y="238" width="424" height="574" rx="18" class="surface"/>
  <text x="534" y="277" class="tag">02 / NEXT.JS APP ROUTER</text>
  <text x="534" y="315" class="column">页面、路由与服务端输出</text>
  <rect x="532" y="340" width="376" height="124" rx="12" class="node"/>
  <text x="554" y="374" class="heading">请求入口与语言</text>
  <text x="554" y="406" class="body">Proxy：主域名、307 / 308</text>
  <text x="554" y="435" class="body">[lang] 布局 → 词典与页面结构</text>
  <rect x="532" y="480" width="376" height="124" rx="12" class="node"/>
  <text x="554" y="514" class="heading">内容渲染</text>
  <text x="554" y="546" class="body">首页等预渲染 · 产品动态路由</text>
  <text x="554" y="575" class="body">服务端 JSON 读取 + 客户端组件</text>
  <rect x="532" y="620" width="376" height="154" rx="12" class="node"/>
  <text x="554" y="654" class="heading">公开页面的索引结构</text>
  <text x="554" y="686" class="body">Metadata · canonical · hreflang</text>
  <text x="554" y="715" class="body">ProductGroup · 变体 · 面包屑</text>
  <text x="554" y="744" class="body">Sitemap · robots · 旧链接迁移</text>

  <rect x="976" y="238" width="424" height="574" rx="18" class="surface"/>
  <text x="1002" y="277" class="tag">03 / REACT INTERACTIONS</text>
  <text x="1002" y="315" class="column">浏览器中的选型体验</text>
  <rect x="1000" y="340" width="376" height="124" rx="12" class="node"/>
  <text x="1022" y="374" class="heading">配置 · 参数 · 图像联动</text>
  <text x="1022" y="406" class="body">合法组合 + hash 深链恢复</text>
  <text x="1022" y="435" class="body">局部放大 · Portal · 移动端预览</text>
  <rect x="1000" y="480" width="376" height="124" rx="12" class="node"/>
  <text x="1022" y="514" class="heading">本地参数搜索</text>
  <text x="1022" y="546" class="body">需求词 → 约束匹配 → 评分</text>
  <text x="1022" y="575" class="body">展示参数证据 · 直达 SKU</text>
  <rect x="1000" y="620" width="376" height="154" rx="12" class="node"/>
  <text x="1022" y="654" class="heading">联系与隐私选择</text>
  <text x="1022" y="686" class="body">邮件草稿 / WhatsApp 入口</text>
  <text x="1022" y="715" class="body">明确同意后才加载 GA4</text>
  <text x="1022" y="744" class="small">没有站内询盘接收 API 与数据库</text>

  <path d="M465 407H504" stroke="#106fb8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M933 407H972" stroke="#106fb8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="844" width="1360" height="116" rx="18" fill="#e6f1f8"/>
  <text x="66" y="880" class="heading">工程边界与交付方式</text>
  <text x="66" y="912" class="body">构建、规则回归与页面验证 → 项目方自行提交发布 → 腾讯云托管 / CDN（具体部署实现位于仓库外）</text>
  <text x="66" y="941" class="small">图示依据 2026-10-19 源码整理；数据模块部分仍有多来源，尚未完成 CMS 统一。</text>
</svg>
